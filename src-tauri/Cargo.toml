[package]
name = "imcl"
version = "1.5.1"
description = "IMCL - a lightweight Minecraft launcher"
authors = ["IMCL contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "imcl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tokio = { version = "1.54.1", features = ["fs", "process", "time", "sync", "io-util", "macros"] }
futures-util = "0.3.34"
sha1_smol = "1.0.1"
anyhow = "1.0.104"
trash = "5.3.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "stream", "form", "query"] }
tauri-plugin-dialog = "2"
md-5 = "0.10"
# 离线皮肤：本机皮肤服务器的签名
rsa = { version = "0.9", features = ["pem"] }
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# 发布版体积/性能优化
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_System_Performance", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

